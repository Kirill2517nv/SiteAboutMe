# Ноутбук: /etc/nginx/sites-available/site-local – сайт на самом ноутбуке
# (после scripts/failover.sh). Это прежний конфиг прода + страница обслуживания.
server {
    server_name kirill-lab.ru www.kirill-lab.ru;
    client_max_body_size 165M;

    location /ws/ {
        proxy_pass http://unix:/run/daphne/site.sock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /static/ {
        alias /home/admin/site/staticfiles/;
    }

    location /media/ {
        alias /home/admin/site/media/;
    }

    location / {
        proxy_pass http://unix:/run/gunicorn/site.sock;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # lbm-srv или gunicorn не отвечает – страница обслуживания, а не 502.
    error_page 502 503 504 =503 /maintenance.html;
    location = /maintenance.html {
        root /home/admin/site/deploy;
        internal;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kirill-lab.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kirill-lab.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    listen 80;
    server_name kirill-lab.ru www.kirill-lab.ru;
    return 301 https://$host$request_uri;
}
