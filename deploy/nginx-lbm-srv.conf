# lbm-srv: /etc/nginx/sites-available/siteschool
# Слушает только Tailscale: снаружи сайт открывает шлюз (ноутбук, nginx +
# Let's Encrypt), сюда приходит уже расшифрованный HTTP.
server {
    listen 100.65.27.51:80;
    server_name kirill-lab.ru www.kirill-lab.ru;
    client_max_body_size 165M;

    access_log /var/log/nginx/siteschool.access.log;
    error_log /var/log/nginx/siteschool.error.log;

    # Настоящий IP ученика – из X-Forwarded-For шлюза (адреса Tailscale).
    set_real_ip_from 100.64.0.0/10;
    real_ip_header X-Forwarded-For;

    location /ws/ {
        proxy_pass http://unix:/run/siteschool/daphne.sock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        # https знает только шлюз – передаём его заголовок, а не свой $scheme (http).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 86400;
    }

    location /static/ {
        alias /home/lih/siteSchool/staticfiles/;
    }

    location /media/ {
        alias /home/lih/siteSchool/media/;
    }

    location / {
        proxy_pass http://unix:/run/siteschool/web.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
