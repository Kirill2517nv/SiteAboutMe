# Ноутбук: /etc/nginx/sites-available/site – режим шлюза (обычный).
# TLS здесь, сайт – на lbm-srv через Tailscale. Авария: scripts/failover.sh
# переключает sites-enabled/site на site-local (nginx-local.conf).
upstream siteschool_lbm {
    server 100.65.27.51:80;
    keepalive 16;  # не открывать соединение через Tailscale на каждый запрос
}

server {
    server_name kirill-lab.ru www.kirill-lab.ru;
    client_max_body_size 165M;

    proxy_connect_timeout 5s;  # lbm-srv выключен – страница обслуживания через 5 с, а не через минуту
    proxy_intercept_errors on;

    location /ws/ {
        proxy_pass http://siteschool_lbm;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://siteschool_lbm;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;  # gunicorn убивает запрос на 60 с
    }

    # lbm-srv или gunicorn не отвечает – страница обслуживания, а не 502.
    error_page 502 503 504 =503 /maintenance.html;
    location = /maintenance.html {
        root /home/admin/site/deploy;
        internal;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kirill-lab.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kirill-lab.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    listen 80;
    server_name kirill-lab.ru www.kirill-lab.ru;
    return 301 https://$host$request_uri;
}
