{% extends 'base.html' %}

{% block title %}Пароль изменён{% endblock title %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md" data-aos="fade-up">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-8 text-center">
            <div class="mx-auto w-16 h-16 bg-green-100 dark:bg-green-900/40 rounded-full flex items-center justify-center mb-4">
                <svg class="w-8 h-8 text-green-600 dark:text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Пароль изменён</h2>
            <p class="text-gray-500 dark:text-slate-400 mt-2">
                В следующий раз входите с новым паролем. Выходить из системы не нужно.
            </p>
            <a href="{% url 'accounts:profile' %}"
               class="inline-block mt-6 bg-brand-600 text-white py-3 px-6 rounded-lg font-medium hover:bg-brand-700 transition-colors">
                Вернуться в профиль
            </a>
        </div>
    </div>
</div>
{% endblock content %}
