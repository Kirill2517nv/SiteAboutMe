{% comment %}Бейдж оценки за блок. Ожидает переменную `grade` (5/4/3/2 или None).{% endcomment %}
{% if grade %}
<span class="inline-flex items-center justify-center w-7 h-7 rounded-lg text-sm font-bold
             {% if grade == 5 %}bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-300
             {% elif grade == 4 %}bg-brand-100 text-brand-700 dark:bg-brand-900/40 dark:text-brand-300
             {% elif grade == 3 %}bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300
             {% else %}bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300{% endif %}">{{ grade }}</span>
{% else %}
<span class="text-gray-300 dark:text-slate-600">–</span>
{% endif %}
