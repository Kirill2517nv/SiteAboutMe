{% comment %}
Вход в «Решения других». Ожидает question_id; compact – плашка для тесной
шапки задачи в практикуме, без него – полноразмерная кнопка (архив решённого).
Один партиал на все входы, чтобы кнопка везде выглядела одинаково.
{% endcomment %}
<a href="{% url 'quizzes:solutions' question_id %}"
   class="group inline-flex items-center gap-2 rounded-lg font-medium transition-colors
          {% if compact %}px-3 py-1.5 text-xs bg-brand-50 text-brand-700 border border-brand-200 hover:bg-brand-100 dark:bg-cyan-900/30 dark:text-cyan-300 dark:border-cyan-800 dark:hover:bg-cyan-900/50
          {% else %}px-4 py-2 text-sm bg-brand-600 text-white shadow-sm hover:bg-brand-700{% endif %}">
    <svg class="{% if compact %}w-3.5 h-3.5{% else %}w-4 h-4{% endif %}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
    </svg>
    {{ label|default:"Решения других" }}
    <svg class="w-3.5 h-3.5 transition-transform group-hover:translate-x-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
    </svg>
</a>
